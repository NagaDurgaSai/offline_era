name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk offline-era-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: offline-era-android.apk

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Offline Era" \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "offline-era-macos.dmg" \
            "build/macos/Build/Products/Release/offline_era.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: offline-era-macos.dmg

  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter config --enable-windows-desktop
      - name: Patch CMake policy for pdfx/pdfium
        run: |
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $env:GITHUB_ENV
        shell: pwsh
      - run: flutter build windows --release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath offline-era-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: offline-era-windows.zip

  create-release:
    needs: [build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
      - uses: actions/download-artifact@v4
        with:
          name: macos
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            offline-era-android.apk
            offline-era-macos.dmg
            offline-era-windows.zip
