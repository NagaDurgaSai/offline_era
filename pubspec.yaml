name: offline_era
description: P2P LAN messenger and clipboard — no internet, no cloud.
publish_to: 'none'
version: 1.5.0+5

environment:
  sdk: ^3.8.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  device_info_plus: ^9.1.0
  google_fonts: ^6.1.0
  provider: ^6.1.1
  network_info_plus: ^5.0.0
  flutter_highlight: ^0.7.0
  file_picker: ^8.0.0
  flutter_local_notifications: ^18.0.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  open_filex: ^4.3.2
  pdfx: ^2.6.0
  share_plus: ^10.0.0
  desktop_drop: ^0.4.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  uuid: ^4.5.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
